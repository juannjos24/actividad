<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Qué pesa más?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">⚖️ ¿Qué pesa más?</span>
  </header>

  <main class="vista">
    <section class="intro">
      <h1>Ordena las tarjetas</h1>
      <p>
        Arrastra las tarjetas (o usa las flechas) para ordenarlas de
        <strong>mayor peso</strong> arriba a <strong>menor peso</strong> abajo.
        ¿Qué cosas ocupan más lugar en tu vida hoy?
      </p>
    </section>

    <div class="escala">
      <span>⬆️ Mayor peso</span>
      <button type="button" id="btn-mezclar" class="btn btn-ghost">🔀 Mezclar</button>
    </div>

    <ol id="lista-tarjetas" class="tarjetas" aria-label="Tarjetas para ordenar"></ol>

    <div class="escala"><span>⬇️ Menor peso</span></div>

    <div class="acciones">
      <button type="button" id="btn-guardar" class="btn btn-primary btn-grande">💾 Guardar</button>
      <span id="estado-guardado" class="estado"></span>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
